<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrys Hotel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="header">
    <button class="menu-btn" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>

    <div class="header-actions">
      <a href="#" class="login-btn">
        <span class="user-icon">♙</span>
        Iniciar sesión o Registrarse
      </a>
      <img src="assets/Black and Gold Vintage Luxury Hotel Logo.png" alt="Chrys Hotel" class="logo">
    </div>
  </header>

  <main>
    <section class="hero">
      <img src="assets/luxury-bedroom-suite-resort-high-rise-hotel-with-working-table.jpg" alt="Habitación del hotel" class="hero-image">

      <img src="assets/Black and Gold Vintage Luxury Hotel Logo.png" alt="Chrys Hotel" class="hero-logo">

      <nav class="hero-nav">
        <a href="#" class="active">Información General</a>
        <a href="#">Alojamientos</a>
        <a href="#">Eventos</a>
      </nav>

      <a href="#" class="location">
        <span>⌖</span> Ubícanos
      </a>
    </section>

    <section class="rooms">
      <h1>Habitaciones y Suites</h1>

      <div class="room-grid">

        <article class="room-card">
          <div class="image-container">
            <img src="assets/interior-modern-comfortable-hotel-room.jpg" alt="Suite Presidencial">
            <button class="expand-btn">↗</button>
          </div>

          <div class="room-content">
            <h2>Suite Presidencial</h2>
            <div class="divider"></div>
            <a href="#" class="price-btn">Ver Tarifas</a>
          </div>
        </article>

        <article class="room-card">
          <div class="image-container">
            <img src="assets/3d-rendering-luxury-bedroom-suite-resort-hotel-with-twin-bed-living.jpg" alt="Habitación">
            <button class="expand-btn">↗</button>
          </div>

          <div class="room-content">
            <h2>Habitación</h2>
            <div class="divider"></div>
            <a href="#" class="price-btn">Ver Tarifas</a>
          </div>
        </article>

      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
